services:
  mysql:
    image: mysql:8.4
    container_name: laporan-proyek-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laporan_proyek
      MYSQL_USER: laporan
      # Override in the root .env (read by Compose); only applied when the volume is first created.
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_root_me}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      # TCP (127.0.0.1) so the networking-disabled temporary init server never reports healthy.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql_data:
